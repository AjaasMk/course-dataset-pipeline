[project]
name = "course-dataset-pipeline"
version = "0.1.0"
description = "Structured, fixed-schema course dataset pipeline grounded in official regulator sources"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.6",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "tiktoken>=0.7",
    "anthropic>=0.68",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
