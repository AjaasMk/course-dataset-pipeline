# Source registry — finalized lineup decision (supersedes the original
# "regulator-only" grounding rule; see CLAUDE.md Hard Constraint 3 and the new
# "Validation rules" section for the safeguard this depends on).
#
# Category meaning:
#   regulatory_primary                          -> official, authoritative, use as-is
#   syllabus_supplement                         -> official-adjacent, curriculum detail
#   fact_supplement_independent_writing_required -> facts only, NEVER copied/paraphrased
#                                                    sentences; validation runs an extra
#                                                    n-gram/similarity check on these
#   general_background                          -> CC BY-SA, different license basis
#   aggregate_stats_only                        -> counts/stats fields only
#   career_info                                 -> career_scope field only
#
# status: verified      -> real, working, structure confirmed scrapeable with
#                           requests+bs4 (or a documented equivalent)
#         blocked        -> real content confirmed to exist, but not reachable
#                           by a plain scripted HTTP client (bot-blocked CDN,
#                           JS-only SPA) — needs a different retrieval strategy
#         needs_scoping  -> real, but doesn't structurally cover what the
#                           pilot category needs; a scoping decision, not a
#                           URL fix, is required before building an adapter
#         unverified     -> URL/domain is real but page structure not yet checked

regulatory_primary:
  engineering:
    regulator: AICTE
    listing_page: https://www.aicte.gov.in/education/model-syllabus
    doc_type: pdf
    status: verified

  medicine:
    regulator: NMC
    listing_page: https://www.nmc.org.in/information-desk/for-colleges/ug-curriculum/
    doc_type: pdf
    status: needs_scoping
    # Page is real and has "UG Curriculum Volume I/II/III" PDFs — but those
    # three volumes are ALL one combined MBBS curriculum, not per-branch
    # documents like AICTE's page. NMC does not appear to cover "Allied
    # Sciences" (Nursing, Pharmacy, etc.) at all — those have their own
    # regulators in India (Indian Nursing Council, Pharmacy Council of
    # India, ...). The "Medicine & Allied Sciences" pilot category may need
    # to be split across multiple regulators, not treated as NMC-only.

  law:
    regulator: BCI
    listing_page: https://www.barcouncilofindia.org/info/ler2008
    doc_type: webpage
    status: blocked
    # Confirmed: barcouncilofindia.org is a client-side React/umi SPA —
    # the raw HTML is just <div id="root"></div>, nothing for requests+bs4
    # to parse. A university mirror of the same Rules of Legal Education
    # 2008 text was found (klc.ac.in) but that specific URL 404'd on
    # verification — no working mirror confirmed yet. Needs either a
    # headless-browser adapter (different from every other adapter's
    # requests+bs4 approach) or a working static mirror/gazette copy
    # (e.g. indiacode.nic.in, not yet checked).

  commerce_management:
    regulator: UGC
    listing_page: https://www.ugc.gov.in/pdfnews/8737712_LOCF-document-on-commerce-2.pdf
    doc_type: pdf
    status: blocked
    # The PDF itself is real (indexed by Google, resolves in a browser) but
    # a plain scripted request (curl, and by extension Python requests) gets
    # HTTP 403 from CloudFront — bot-blocked at the CDN, not a wrong URL.
    # Tried with a browser User-Agent and a Referer header, same result.
    # Needs a different retrieval approach than plain requests.get().

syllabus_supplement:
  - name: NPTEL
    full_name: National Programme on Technology Enhanced Learning
    use: subject/curriculum breakdown, especially Engineering
    listing_page: https://nptel.ac.in/localchapter/discipline
    status: blocked
    # CORRECTED: originally marked verified based on a WebFetch result, but
    # WebFetch renders JavaScript before reading the page — a plain
    # curl/requests fetch (what the actual adapter uses) gets a near-empty
    # Svelte SPA shell, no discipline names, no links. Same category as BCI —
    # needs a headless-browser adapter, not requests+bs4. The discipline
    # grouping ("Aerospace, Agriculture Engineering & Architecture and
    # Planning" as one combined category, linking out to a Google Drive
    # folder per discipline, not a plain doc list) is real, seen via
    # WebFetch's rendered output, but unconfirmed by a method matching what
    # we'll actually scrape with.

fact_supplement_independent_writing_required:
  - name: Careers360
    status: verified
    # Checked a real content page (course college-list page), not just the
    # homepage — 258KB, real target-term matches, genuinely server-rendered.
  - name: Coursera
    status: verified
    # The /courses?query=... path 301-redirects to a clean /browse/<category>
    # URL; that destination is 959KB with real content — genuinely usable.
    # (The redirect itself is a real finding: build_index()/match() for this
    # source would need to follow it, not treat it as a dead end.)
  - name: edX
    status: verified # thin signal — see caveat below
    # Weaker confirmation than the other two: a subject page (835KB) has an
    # accurate, specific <title> (suggests server-side rendering, likely
    # Next.js) but only 2 body mentions of the target term — most of the
    # visible content may still hydrate client-side. Workable, but don't
    # assume it behaves like Careers360/Coursera without checking the
    # specific page type actually needed when this adapter gets built.
  - name: university_websites
    scope: [".ac.in", ".edu"]

general_background:
  - name: Wikipedia
    license: CC BY-SA
    note: >
      Usable WITH attribution + share-alike compliance — a different license
      basis than every other source in this registry. Keep separate; don't
      fold into fact_supplement handling, its compliance requirements differ.

aggregate_stats_only:
  # college counts etc. — NEVER from Careers360 or any aggregator
  - name: AISHE
    listing_page: https://dashboard.aishe.gov.in/hedirectory/#/hedirectory/universityMoreDetails/ALL/ALL
    status: unverified
    # Confirmed real (Angular SPA, page loads). Landing on the deep-linked
    # hash route serves the generic homepage, not the directory table — the
    # data view needs an in-page interaction to load. First-load network
    # trace showed no REST API call yet; the actual data-fetching endpoint
    # hasn't been identified. Needs a browser-driven session (not plain
    # requests) to find it, or acceptance that this needs headless-browser
    # tooling like BCI does.
  - name: AICTE
    status: verified # same source as regulatory_primary.engineering above

career_info:
  - name: NCS
    full_name: National Career Service
    use: career scope, job profiles
    listing_page: https://www.ncs.gov.in/content-repository/Pages/BrowseBySectors.aspx
    status: verified # page itself; matching approach is a separate open question
    # Page confirmed real: 52 sectors, exact pattern
    # /content-repository/Pages/ViewNcos.aspx?FilterField1=Industry_x002F_
    # Sector...&FilterValue1=<SectorName> (e.g. Agriculture, Automotive,
    # Aerospace and Aviation, Capital Goods and Manufacturing).
    #
    # DEFERRED, not blocked: course_name-to-sector matching is NOT a fuzzy
    # string-matching problem like AICTE's — "Mechanical Engineering" shares
    # no text with its correct sectors ("Automotive", "Capital Goods and
    # Manufacturing"). Forcing this through SourceAdapter.match() would
    # return a confidently-wrong result, not an honestly-low-confidence one.
    # This is a course-category-to-sector categorization problem, likely
    # belonging in Stage 2 (LLM-driven) rather than Stage 1 fuzzy-match —
    # NCS may not fit the SourceAdapter shape other sources use at all.
    # Skipped pending that design decision — do not build NCSAdapter as a
    # copy of AICTEAdapter without resolving this first.

# Maps each pilot category (config/pilot_courses.yaml's `category` field,
# also src/schema.py's ManifestEntry.tier) to the tier_group that selects
# its retrieval_order sequence below.
categories:
  engineering: strong_tier
  medicine: strong_tier
  commerce_management: medium_tier
  law: medium_tier
  animation_design: weak_tier
  media_mass_comm: weak_tier

# Confidence threshold for accepting a match() result during orchestrated
# retrieval (src/retrieve/orchestrator.py). Below this, retrieve_course()
# falls through to the next source in retrieval_order rather than
# downloading a low-confidence match — this is what correctly rejects
# AICTE's Aerospace Engineering "Textile Engineering" match (confidence
# 0.69) instead of downloading the wrong document.
matching:
  threshold: 0.80

# Declarative retrieval order per tier. Consumed by src/retrieve/orchestrator.py's
# retrieve_course() — walks each entry in order via SourceCategory(entry), so
# every entry here MUST be a real SourceCategory value (regulatory_primary,
# syllabus_supplement, fact_supplement_independent_writing_required,
# general_background, aggregate_stats_only, career_info). A source NAME within
# a category (e.g. "university_websites" is a named entry under
# fact_supplement_independent_writing_required, not its own category) does not
# belong here — retrieve_course() has no concept of picking one named source
# out of a category, only of trying a category via its registered adapter(s).
#
# DECISION (2026-07-17): fact_supplement_independent_writing_required
# (Careers360) is tried FIRST in every tier, ahead of regulatory_primary —
# reversing the original regulator-first order, including for engineering
# where AICTE is verified and already working end-to-end. Rationale: NMC/
# BCI/UGC are blocked/needs_scoping (see status notes above) while
# Careers360 is verified and simpler to retrieve from uniformly across
# tiers; rather than block retrieval on hard-to-access regulator sites,
# Careers360 becomes the default primary source everywhere.
#
# Explicit, accepted tradeoff: this means strong/medium tier metrics
# (CLAUDE.md Hard Constraint 6) will blend regulator-backed and
# Careers360-backed results under the same tier label going forward — the
# tier label no longer implies "regulator-sourced." Chosen deliberately in
# favor of simplicity over that distinction; not an oversight.
#
# DECISION (2026-07-17, later same day): general_background (Wikipedia) added
# as the last-resort entry for medium_tier and weak_tier, after regulatory
# sources and Careers360 both fail. This REVISES the weak-tier hard
# constraint in CLAUDE.md/README.md ("don't fix weak-tier failures by
# falling back to other sources") — an explicit, deliberate policy change,
# not an oversight; see CLAUDE.md Hard Constraint 6 note for the rationale.
# Also removed: the redundant "university_websites" entry from medium_tier
# (it's a named source WITHIN fact_supplement, already covered by that
# entry, not a separate category — see note above) and
# "university_scoped_search" from weak_tier (not a SourceCategory at all; no
# adapter exists for the scoped-search method it referred to — see
# weak_tier_scoped_search_notes below). The old, contradictory
# weak_tier_fallback.order block (which disagreed with this list on
# ordering) is removed entirely — this is now the single source of truth.
retrieval_order:
  strong_tier: # Engineering, Medicine
    - fact_supplement_independent_writing_required
    - regulatory_primary
    - syllabus_supplement
  medium_tier: # Law, Commerce/Management
    - fact_supplement_independent_writing_required
    - regulatory_primary
    - general_background
  weak_tier: # Animation/Media/Arts — no regulator exists, no regulatory_primary step
    - fact_supplement_independent_writing_required
    - general_background

# NOT consumed by retrieve_course() — general_background has no adapter
# registered yet (no WikipediaAdapter exists), so this entry currently just
# skips silently, same as any other unregistered category. Adding it above
# is a config-level policy decision now; it becomes a real fallback only
# once a WikipediaAdapter is built and registered.

weak_tier_scoped_search_notes:
  # Animation/Media/Arts — no regulator exists. These describe HOW a future
  # scoped-search adapter would work; not consumed by retrieve_course() (not
  # a SourceCategory, no adapter built). Kept as design notes for when this
  # gets built, not as an active retrieval_order entry.
  animation_design:
    method: scoped_search
    allowed_domains: [".ac.in", ".edu"]
    query_template: "{course_name} syllabus curriculum"
  media_mass_comm:
    method: scoped_search
    allowed_domains: [".ac.in", ".edu"]
    query_template: "{course_name} syllabus curriculum"
