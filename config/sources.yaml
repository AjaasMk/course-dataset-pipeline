# Source registry — rebuilt 2026-08-07 against the client cookbook's Source
# Directory sheet (44 named sources) and Regulator Map sheet.
# See docs/superpowers/specs/2026-08-07-stage1-intent-first-retrieval-design.md
#
# Replaces the previous 6-bucket SourceCategory model and its retrieval_order /
# strong_tier / medium_tier / weak_tier groups. Those encoded "one ordered list of
# sources per course", which the intent-first redesign removes: source selection is
# now per-segment, and authority is per-source-tier rather than per-course.
#
# tiers: a LIST, not a scalar — the client directory assigns several sources to two
#   tiers (NSDC A/B, ICAR A/B, SWAYAM A/B, LBS Kerala A/B, LinkedIn Jobs C/D).
#
#   A -> government / statutory / professional regulator. Canonical.
#   B -> official institutional / academic document.
#   C -> official employer evidence.
#   D -> commercial portal. DISCOVERY AND TRIANGULATION ONLY — never canonical
#        without Tier A/B/C corroboration. Never overrides official evidence.
#   E -> user reviews/forums. No named sources in the client directory.
#   F -> AI-generated text. Never canonical, by client rule. Not a retrievable
#        source; present in the tier enum only so precedence logic can name it.
#
# status: verified      -> an adapter works end to end against this source
#         reachable     -> the ENTRY URL server-renders real content to a plain
#                          scripted client. This is NOT the same as verified: it
#                          says nothing about whether the specific data page we
#                          need renders. NPTEL is the cautionary case — its
#                          homepage renders fine while /localchapter/discipline
#                          is a JS-only shell. Confirm the actual target page
#                          before building an adapter.
#         blocked       -> content exists but is unreachable by a plain scripted
#                          client (JS-only shell, or an HTTP 403/429 bot-block)
#         unverified    -> inconclusive: the probe could not complete (TLS chain
#                          failure, connect timeout) or the URL 404s
#
# Statuses below were set from a live probe on 2026-08-07
# (scripts/probe_sources.py, report in data/). Re-run it rather than trusting
# these values indefinitely — several were wrong before that probe.

sources:
  UGC:
    name: University Grants Commission
    official_url: https://www.ugc.gov.in/
    authority_type: Statutory regulator
    tiers: [A]
    coverage: National
    best_used_for: University recognition; degree nomenclature; regulations; HEI categories
    usage_rule: Primary canonical source for university-level recognition and degree rules
    refresh: as regulations change
    match_threshold: 0.65
    status: verified
    # VERIFIED end to end 2026-08-07 by UGCAdapter against /regulations, which
    # serves 61 usable regulation PDFs. Site quirk: nearly every regulation link
    # is labelled "View", so the document name exists only in the uploaded
    # filename behind a numeric upload id — titles are derived from the filename,
    # not the anchor text. Uploads named as a bare content hash are dropped.
    # CORRECTED 2026-08-07 by live probe: ugc.gov.in was recorded as `blocked`,
    # but that was only ever true of one LOCF PDF path behind CloudFront. The
    # site itself serves 15,624 chars of text and 248 links (63 PDFs) to a plain
    # request with browser headers. The old status generalised a path-specific
    # 403 into a site-wide block and cost this source its Tier A role for weeks.

  UGC_HEI_SEARCH:
    name: UGC university details
    official_url: https://www.ugc.gov.in/universitydetails/university
    authority_type: Official directory
    tiers: [A]
    coverage: National
    best_used_for: Central/state/private/deemed universities and institutions of national importance
    usage_rule: Verify the exact institution category and current status
    refresh: annual / ongoing
    status: blocked
    # Institution-registry critical path, and genuinely blocked: HTTP 403 to a
    # scripted client even with full browser headers, while ugc.gov.in itself
    # serves fine. The block is specific to this endpoint. Escalation per the
    # spec: look for an open-data equivalent before reaching for a browser.

  UGC_DEB:
    name: Distance Education Bureau
    official_url: https://deb.ugc.ac.in/
    authority_type: Statutory programme directory
    tiers: [A]
    coverage: National
    best_used_for: Recognised online and distance programmes by session
    usage_rule: Verify institution, programme and admission session together
    refresh: every admission cycle
    status: reachable

  AISHE:
    name: All India Survey on Higher Education
    official_url: https://aishe.gov.in/
    authority_type: Government directory/data
    tiers: [A]
    coverage: National
    best_used_for: Universities, colleges, standalone institutions, programmes and enrolment
    usage_rule: Use AISHE code as an institutional identifier where available
    refresh: annual
    status: reachable
    # Entry URL serves 3,275 chars and 111 links to a plain request — so the site
    # is not wholesale bot-blocked, revising the earlier assumption. The
    # *directory view* is still the open question: it is an Angular app whose
    # deep-linked hash route falls back to the generic homepage, and no REST
    # endpoint surfaced on first load. Institution-registry critical path; find
    # the data endpoint or an open-data dump before reaching for a browser.

  NIRF:
    name: National Institutional Ranking Framework
    official_url: https://www.nirfindia.org/
    authority_type: Government ranking
    tiers: [A]
    coverage: National
    best_used_for: Institution/category rankings, rank bands, scores and methodology
    usage_rule: Do not mislabel institution/category rank as course rank
    refresh: annual
    status: verified
    # VERIFIED end to end 2026-08-07 by NIRFAdapter against the live site.
    # Year index -> per-discipline ranking pages; the ranking TABLE is fully
    # server-rendered (2025 Engineering: 19,086 chars, 301 rows) and carries NIRF
    # Institute IDs, city, state, score and rank. Serves the Ranking segment and
    # supplies the top-N bound on institutions per course.

  NAAC:
    name: National Assessment and Accreditation Council
    official_url: https://www.naac.gov.in/
    authority_type: Accreditation body
    tiers: [A]
    coverage: National
    best_used_for: Institutional accreditation status and grade
    usage_rule: Accreditation is not the same as ranking or legal recognition
