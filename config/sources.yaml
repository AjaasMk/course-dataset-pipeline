# Course area -> primary regulator + secondary validation, from the cookbook's
# Regulator Map sheet. Routes a course family to the right Tier A authority.
regulator_map:
  general_university_degrees:
    primary: UGC
    secondary: [AISHE, UGC_HEI_SEARCH]
    note: UGC recognition does not replace programme-specific professional approval where required.
  engineering_technology:
    primary: AICTE
    secondary: [UGC, AISHE, NBA]
    note: Check whether the programme category requires AICTE approval under current rules.
  medicine:
    primary: NMC
    secondary: [MCC]
    note: Use current approved-college and seat lists.
  dentistry:
    primary: DCI
    secondary: [MCC]
    note: Validate the exact institution and programme.
  nursing:
    primary: INC
    secondary: [UGC]
    note: Both national and state validation may matter.
  pharmacy:
    primary: PCI
    secondary: [AICTE]
    note: Check DPharm/BPharm/PharmD separately.
  architecture:
    primary: COA
    secondary: [UGC]
    note: Professional qualification and admission rules require precise verification.
  teacher_education:
    primary: NCTE
    secondary: [UGC]
    note: Do not rely only on the college prospectus.
  law:
    primary: BCI
    secondary: [UGC]
    note: Verify current recognition of 3-year and 5-year programmes.
  agriculture:
    primary: ICAR
    secondary: [UGC]
    note: ICAR accreditation/ranking and legal university recognition are different.
  rehabilitation_special_education:
    primary: RCI
    secondary: [UGC]
    note: Critical for regulated professional eligibility.
  online_distance:
    primary: UGC_DEB
    secondary: [UGC]
    note: Verify every session; do not assume a programme stays recognised indefinitely.
  vocational_nsqf:
    primary: NQR
    secondary: [NSDC]
    note: Use official qualification files and version.

# Per-segment source preferences, from the cookbook's Segment Sources sheet.
# `preferred` are tried as primary; `secondary` may corroborate. `min_tier` is the
# lowest tier permitted to hold a PRIMARY role for this segment — a source below it
# can only ever be discovery/secondary.
segment_sources:
  Course Identity:
    preferred: [UGC, AICTE, NQR]
    secondary: [UGC_HEI_SEARCH]
    min_tier: A
  Duration & Mode:
    preferred: [UGC, AICTE, UGC_DEB]
    secondary: [NQR]
    min_tier: B
  Eligibility:
    preferred: [UGC, AICTE, NMC, DCI, INC, PCI, COA, NCTE, BCI, RCI, ICAR]
    secondary: [CUET, NTA]
    min_tier: B
  Entrance & Admission:
    preferred: [NTA, CUET, JOSAA, CSAB, MCC, CEE_KERALA, LBS_KERALA]
    secondary: [UGC]
    min_tier: A
  Curriculum:
    preferred: [AICTE, NMC, PCI, COA, NCTE, ICAR]
    secondary: [NPTEL, SWAYAM]
    min_tier: B
  Specialisation:
    preferred: [UGC, AICTE, NQR]
    secondary: [SWAYAM]
    min_tier: B
  Institution & Offering:
    preferred: [AISHE, UGC_HEI_SEARCH, UGC_DEB]
    secondary: [NIRF, NBA, NAAC]
    min_tier: B
  Ranking & Accreditation:
    preferred: [NIRF, NAAC, NBA]
    secondary: [UGC]
    min_tier: A
  Fees:
    preferred: [CEE_KERALA, LBS_KERALA, DTE_KERALA]
    secondary: [JOSAA, MCC]
    min_tier: B
  Scholarships:
    preferred: [NSP, AICTE]
    secondary: [SKILL_INDIA_DIGITAL]
    min_tier: B
  Career Mapping:
    preferred: [NCS, NQR, NSDC]
    secondary: [SKILL_INDIA_DIGITAL]
    min_tier: A
  Salary:
    preferred: [MOSPI_PLFS, NIRF]
    secondary: [LINKEDIN_JOBS, AMBITIONBOX, GLASSDOOR, INDEED, NAUKRI]
    min_tier: C
  Recruiters & Placement:
    preferred: [NIRF]
    secondary: [LINKEDIN_JOBS]
    min_tier: C
  Internships:
    preferred: [APPRENTICESHIP_INDIA, NATS, AICTE_INTERNSHIP]
    secondary: [SKILL_INDIA_DIGITAL]
    min_tier: B

# Confidence floor for accepting an adapter's discovered document. Below this the
# resolution is recorded as failed with a reason rather than downloaded — this is
# what correctly rejects AICTE's Aerospace Engineering "Textile Engineering" match
# at 0.69 instead of retrieving the wrong document.
matching:
  threshold: 0.80
