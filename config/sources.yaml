  NQR:
    name: National Qualifications Register
    official_url: https://www.nqr.gov.in/
    authority_type: Government qualification register
    tiers: [A]
    coverage: National
    best_used_for: NSQF-aligned qualifications, levels, awarding and approving bodies
    usage_rule: Strong source for vocational and skill qualifications
    refresh: ongoing
    status: verified
    # VERIFIED end to end 2026-08-07 by NQRAdapter. 61 qualification sectors
    # indexed live from the homepage, each linking to /qualifications-search/<id>.
    # Notably the FIRST source since AICTE whose anchor text is the actual label —
    # no href, filename or query-string extraction needed. Same planner
    # requirement as NCS: query_terms must be sector-level, not course names.

  NCS:
    name: National Career Service
    official_url: https://www.ncs.gov.in/
    authority_type: Government career service
    tiers: [A]
    coverage: National
    best_used_for: Occupations, career descriptions and labour-market information
    usage_rule: Map course pathways to occupations rather than making job guarantees
    refresh: ongoing
    status: verified
    listing_page: https://www.ncs.gov.in/content-repository/Pages/BrowseBySectors.aspx
    # VERIFIED end to end 2026-08-07 by NCSAdapter. 52 sectors indexed live.
    # Sector anchors carry NO text; the name exists only in the FilterValue1 query
    # parameter — a fourth distinct place these sites hide their labels.
    #
    # Course-to-sector mapping is NOT fuzzy string matching: "Mechanical
    # Engineering" is served by Automotive and Capital Goods and Manufacturing,
    # and resembles neither. Confirmed live — that query scores 0.49 and is
    # correctly rejected. The planner MUST supply sector-level query_terms; the
    # adapter deliberately does not guess, which is exactly what makes this source
    # usable under the intent-first model and unusable under the old one.

